# 云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
        default: ""
      WRT_TEST:
        required: false
        type: string
        default: "false"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRT_CONFIG: ${{ inputs.WRT_CONFIG }}
  WRT_THEME: ${{ inputs.WRT_THEME }}
  WRT_NAME: ${{ inputs.WRT_NAME }}
  WRT_SSID: ${{ inputs.WRT_SSID }}
  WRT_WORD: ${{ inputs.WRT_WORD }}
  WRT_IP: ${{ inputs.WRT_IP }}
  WRT_PW: ${{ inputs.WRT_PW }}
  WRT_REPO: ${{ inputs.WRT_REPO }}
  WRT_BRANCH: ${{ inputs.WRT_BRANCH }}
  WRT_SOURCE: ${{ inputs.WRT_SOURCE }}
  WRT_PACKAGE: ${{ inputs.WRT_PACKAGE }}
  WRT_TEST: ${{ inputs.WRT_TEST }}

jobs:
  core:
    name: ${{ inputs.WRT_SOURCE }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          sudo -E apt-get -yqq purge firefox || true
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq full-upgrade
          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq autoclean
          sudo -E apt-get -yqq clean

          sudo -E apt-get -yqq install \
            dos2unix \
            python3-netifaces \
            libfuse-dev

          sudo bash -c \
            'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

          sudo systemctl daemon-reload
          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo rm -rf /mnt/build_wrt
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt

          rm -rf "$GITHUB_WORKSPACE/wrt"
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Initialization Values
        run: |
          set -Eeuo pipefail

          CONFIG_FILE="$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: configuration file does not exist:"
            echo "$CONFIG_FILE"
            exit 1
          fi

          WRT_TARGET_VALUE="$(
            grep -m 1 -oP \
              '^CONFIG_TARGET_\K[\w]+(?=\=y)' \
              "$CONFIG_FILE" || true
          )"

          if [ -z "$WRT_TARGET_VALUE" ]; then
            echo "ERROR: unable to detect target from:"
            echo "$CONFIG_FILE"
            exit 1
          fi

          {
            echo "WRT_DATE=$(TZ=UTC-8 date +'%y.%m.%d-%H.%M.%S')"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_TARGET=$WRT_TARGET_VALUE"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"

      - name: Clone Code
        run: |
          set -Eeuo pipefail

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt/

          cd ./wrt/

          WRT_HASH_VALUE="$(git log -1 --pretty=format:'%h')"
          echo "WRT_HASH=$WRT_HASH_VALUE" >> "$GITHUB_ENV"

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i \
              -e '/\.cn\//d' \
              -e '/tencent/d' \
              -e '/aliyun/d' \
              "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          set -Eeuo pipefail

          find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iregex '.*\(txt\|sh\)$' \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;

      - name: Cache Downloads And Ccache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          key: wrt-v3-${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_HASH }}
          restore-keys: |
            wrt-v3-${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-
            wrt-v3-${{ env.WRT_CONFIG }}-
          path: |
            ./wrt/.ccache
            ./wrt/dl

      - name: Clean Host Build State
        run: |
          set -Eeuo pipefail
          cd ./wrt/

          echo "==== Clean stale host build state ===="

          rm -rf \
            ./staging_dir/host \
            ./staging_dir/hostpkg \
            ./build_dir/host \
            ./build_dir/hostpkg \
            ./tmp

          mkdir -p ./tmp

          echo "Host build state cleaned."

      - name: Update Feeds
        run: |
          set -Eeuo pipefail
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          set -Eeuo pipefail
          cd ./wrt/package/

          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

          echo "==== Third-party package Makefiles ===="

          find . \
            -maxdepth 6 \
            -type f \
            -name Makefile \
            \( \
              -path '*luci-theme-aurora*' \
              -o -path '*luci-app-passwall*' \
              -o -path '*luci-app-lucky*' \
              -o -path '*/lucky/*' \
              -o -path '*luci-app-mosdns*' \
              -o -path '*/mosdns/*' \
              -o -path '*luci-app-gecoosac*' \
              -o -path '*/gecoosac/*' \
            \) \
            -print || true

      - name: Custom Settings
        run: |
          set -Eeuo pipefail
          cd ./wrt/

          CONFIG_FILE="$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt"
          GENERAL_FILE="$GITHUB_WORKSPACE/Config/GENERAL2.txt"

          rm -f .config

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat "$CONFIG_FILE" > .config
          else
            if [ ! -f "$GENERAL_FILE" ]; then
              echo "ERROR: general configuration does not exist:"
              echo "$GENERAL_FILE"
              exit 1
            fi

            cat "$CONFIG_FILE" "$GENERAL_FILE" > .config
          fi

          "$GITHUB_WORKSPACE/Scripts/Settings.sh"

          echo "==== Process manual package input ===="

          if [ -n "${WRT_PACKAGE:-}" ]; then
            NORMALIZED_PACKAGES="$(
              printf '%s\n' "$WRT_PACKAGE" |
                tr ',;~' '\n\n\n' |
                sed 's/\r$//'
            )"

            while IFS= read -r PACKAGE; do
              PACKAGE="$(
                printf '%s' "$PACKAGE" |
                  sed \
                    -e 's/^[[:space:]]*//' \
                    -e 's/[[:space:]]*$//'
              )"

              [ -z "$PACKAGE" ] && continue

              case "$PACKAGE" in
                \#*)
                  continue
                  ;;
              esac

              if ! printf '%s' "$PACKAGE" |
                grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+@-]*$'; then
                echo "ERROR: invalid package name:"
                echo "$PACKAGE"
                exit 1
              fi

              awk -v package="$PACKAGE" '
                $0 != package {
                  print
                }
              ' .config > .config.tmp

              mv .config.tmp .config

              awk -v symbol="CONFIG_PACKAGE_${PACKAGE}" '
                index($0, symbol "=") == 1 {
                  next
                }

                $0 == "# " symbol " is not set" {
                  next
                }

                {
                  print
                }
              ' .config > .config.tmp

              mv .config.tmp .config

              printf 'CONFIG_PACKAGE_%s=y\n' "$PACKAGE" >> .config
              echo "Enabled manual package: $PACKAGE"
            done <<< "$NORMALIZED_PACKAGES"
          else
            echo "No additional manual package was entered."
          fi

          echo "==== Remove builder information ===="

          awk '
            index($0, "CONFIG_VERSION_CODE=") == 1 {
              next
            }

            $0 == "# CONFIG_VERSION_CODE is not set" {
              next
            }

            {
              print
            }
          ' .config > .config.tmp

          mv .config.tmp .config
          printf '%s\n' 'CONFIG_VERSION_CODE=""' >> .config

          echo "==== Ensure Aurora theme is enabled ===="

          awk '
            index($0, "CONFIG_PACKAGE_luci-theme-aurora=") == 1 {
              next
            }

            $0 == "# CONFIG_PACKAGE_luci-theme-aurora is not set" {
              next
            }

            {
              print
            }
          ' .config > .config.tmp

          mv .config.tmp .config
          printf '%s\n' \
            'CONFIG_PACKAGE_luci-theme-aurora=y' \
            >> .config

          echo "==== Check invalid .config lines ===="

          if ! awk '
            /^[[:space:]]*$/ {
              next
            }

            /^#/ {
              next
            }

            /^CONFIG_[A-Za-z0-9_.+@-]+=.*$/ {
              next
            }

            {
              print NR ":" $0
              invalid = 1
            }

            END {
              exit invalid
            }
          ' .config > .config.invalid; then
            cat .config.invalid
            rm -f .config.invalid
            echo "ERROR: invalid lines were found in .config"
            exit 1
          fi

          rm -f .config.invalid
          echo "No invalid .config lines found."

          echo "==== Ensure LuCI theme source ===="

          AURORA_MAKEFILE="$(
            find ./package \
              -type f \
              -path '*/luci-theme-aurora/Makefile' \
              -print \
              -quit
          )"

          if [ -z "$AURORA_MAKEFILE" ]; then
            echo "ERROR: luci-theme-aurora/Makefile was not found."

            find ./package \
              -maxdepth 7 \
              -iname '*aurora*' \
              -print || true

            exit 1
          fi

          echo "Aurora Makefile: $AURORA_MAKEFILE"

          make defconfig

          echo "==== Firmware version configuration ===="

          grep -E \
            '^CONFIG_VERSION_(CODE|NUMBER|DIST)=' \
            .config || true

          echo "==== Aurora configuration ===="

          grep -E \
            '^(CONFIG_PACKAGE_luci-theme-aurora|CONFIG_LUCI_THEME_)' \
            .config || true

          if ! grep -q \
            '^CONFIG_PACKAGE_luci-theme-aurora=y$' \
            .config; then
            echo "ERROR: luci-theme-aurora was removed by make defconfig."
            echo "The package source was not recognized by the build system."
            exit 1
          fi

          echo "==== Selected custom packages ===="

          grep -E \
            '^CONFIG_PACKAGE_(luci-theme-aurora|luci-app-passwall|luci-app-lucky|lucky|luci-app-mosdns|mosdns|luci-app-gecoosac|gecoosac|luci-app-microsocks|microsocks)=y$' \
            .config || true

          make clean -j"$(nproc)"

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          set -Eeuo pipefail
          cd ./wrt/

          make download -j"$(nproc)"

          find ./dl \
            -type f \
            -size -1024c \
            -print \
            -delete || true

      - name: Prepare Host Build Tools
        if: env.WRT_TEST != 'true'
        run: |
          set -Eeuo pipefail
          cd ./wrt/

          echo "==== Build host tools ===="

          make tools/install -j"$(nproc)" || \
            make tools/install -j1 V=s

          echo "==== Check host sed ===="

          if [ ! -x ./staging_dir/host/bin/sed ]; then
            echo "Host sed is missing. Rebuilding host tools."

            rm -rf \
              ./staging_dir/host \
              ./staging_dir/hostpkg \
              ./build_dir/host \
              ./build_dir/hostpkg \
              ./tmp

            mkdir -p ./tmp

            make tools/install -j1 V=s
          fi

          if [ ! -x ./staging_dir/host/bin/sed ]; then
            echo "ERROR: host sed was not generated."

            find ./staging_dir \
              -maxdepth 5 \
              -type f \
              -name sed \
              -print 2>/dev/null || true

            exit 1
          fi

          HOST_SED_PATH="$(readlink -f ./staging_dir/host/bin/sed)"

          echo "Host sed: $HOST_SED_PATH"
          ./staging_dir/host/bin/sed --version | head -n 1 || true

      - name: Compile Aurora Theme
        if: env.WRT_TEST != 'true'
        run: |
          set -Eeuo pipefail
          cd ./wrt/

          echo "==== Verify host sed before compiling Aurora ===="

          if [ ! -x ./staging_dir/host/bin/sed ]; then
            echo "ERROR: host sed is missing before Aurora compilation."
            exit 1
          fi

          echo "==== Compile luci-theme-aurora ===="

          make package/luci-theme-aurora/compile -j1 V=s

          echo "==== Aurora package output ===="

          AURORA_APK="$(
            find ./bin \
              -type f \
              -iname 'luci-theme-aurora*.apk' \
              -print \
              -quit
          )"

          if [ -z "$AURORA_APK" ]; then
            echo "ERROR: luci-theme-aurora APK was not generated."

            find ./bin \
              -type f \
              \( \
                -iname '*aurora*' \
                -o -iname '*theme*.apk' \
              \) \
              -print || true

            exit 1
          fi

          echo "Generated package: $AURORA_APK"

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          set -o pipefail
          cd ./wrt/

          make -j"$(nproc)" || make -j1 V=s

      - name: Machine Information
        if: always()
        run: |
          set -Eeuo pipefail
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "Model name|Core|Thread" || true
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        if: success()
        run: |
          set -Eeuo pipefail
          cd ./wrt/

          mkdir -p ./upload/

          cp -f \
            ./.config \
            "./upload/Config-$WRT_CONFIG-$WRT_INFO-$WRT_BRANCH-$WRT_DATE.txt"

          if [[ "$WRT_TEST" != "true" ]]; then
            WRT_KVER_VALUE="$(
              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -h -oP '^kernel - \K[\d.]+' {} \; |
                head -n 1 || true
            )"

            WRT_LIST_VALUE="$(
              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -h -oP '^luci-(app|theme)[^ ]*' {} \; |
                sort -u |
                tr '\n' ' ' || true
            )"

            {
              echo "WRT_KVER=${WRT_KVER_VALUE:-none}"
              echo "WRT_LIST=${WRT_LIST_VALUE:-none}"
            } >> "$GITHUB_ENV"

            find ./bin/targets/ \
              -type f \
              \( \
                -name "*.buildinfo" \
                -o -name "*.json" \
                -o -name "sha256sums" \
                -o -name "*.packages" \
              \) \
              -delete

            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue

              FILE_BASE="$(basename "$FILE")"

              if [[ "$FILE_BASE" == *.* ]]; then
                EXT="${FILE_BASE#*.}"
                FILE_STEM="${FILE_BASE%%.*}"
              else
                EXT=""
                FILE_STEM="$FILE_BASE"
              fi

              NAME="$(
                printf '%s\n' "$FILE_STEM" |
                  grep -io "\($WRT_TARGET\).*" || true
              )"

              if [ -z "$NAME" ]; then
                NAME="$FILE_STEM"
              fi

              if [ -n "$EXT" ]; then
                NEW_FILE="$WRT_INFO-$WRT_BRANCH-$NAME-$WRT_DATE.$EXT"
              else
                NEW_FILE="$WRT_INFO-$WRT_BRANCH-$NAME-$WRT_DATE"
              fi

              mv -f "$FILE" "./upload/$NEW_FILE"
            done < <(
              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*"
            )

            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;

            make clean -j"$(nproc)"
          fi

          echo "==== Upload files ===="

          find ./upload \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

      - name: Release Firmware
        if: success()
        uses: softprops/action-gh-release@master
        with:
          tag_name: 精简版${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}
          files: ./wrt/upload/*.*
          body: |
            这是个ZN-M2无WiFi无usb的固件包！
            请注意选择，不要选错！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：password或者 ${{ env.WRT_PW }}

            WIFI名称：${{ env.WRT_SSID }}（无WiFi版本没有）
            WIFI密码：${{ env.WRT_WORD }}（无WiFi版本没有）

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}
